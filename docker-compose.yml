services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ampai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ampai
      POSTGRES_USER: ampai
      POSTGRES_PASSWORD: ampai
    volumes:
      - ampai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ampai -d ampai"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ampai-redis
    restart: unless-stopped
    volumes:
      - ampai_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ampai:
    build:
      context: .
    container_name: ampai-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ampai:ampai@db:5432/ampai
      REDIS_URL: redis://redis:6379/0
      SESSION_RECALL_DB_PATH: /data/agent_data/session_recall.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ALLOWED_ORIGINS: http://localhost:1420,http://127.0.0.1:1420,tauri://localhost,http://tauri.localhost,https://tauri.localhost
      AMPAI_DEFAULT_ADMIN_USERNAME: admin
      AMPAI_DEFAULT_ADMIN_PASSWORD: P@ssw0rd
      USER_USERNAME: user
      USER_PASSWORD: user123
      JWT_SECRET: change-me-for-production
    volumes:
      - ampai_data:/data

volumes:
  ampai_postgres:
  ampai_redis:
  ampai_data:
